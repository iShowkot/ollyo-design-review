# When a release is published on GitHub, build the skill ZIP and attach it,
# so the "latest" download link in the README always serves the new version.
name: Attach skill ZIP to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/package.sh
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/ollyo-design-review.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
